<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MVP</title>

  <!-- 1. FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />

  <!-- 2. Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />

  <!-- 3. MDBootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.1.0/mdb.min.css" rel="stylesheet" />

  <!-- 4. O SEU CSS -->
  <link rel="stylesheet" href="styles/login.css">
</head>

<body>
  <section class="vh-100">
    <div class="container-fluid h-custom">
      <div class="row d-flex justify-content-center align-Fitems-center h-100">
        <div class="col-md-9 col-lg-6 col-xl-5">
          <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp" class="img-fluid"
            alt="Sample image">
        </div>
        <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">

          <form id="form-login">
            <!-- Email input -->
            <div class="d-flex flex-row align-items-center justify-content-center justify-content-lg-start">
            </div>
              <!-- Email input (Versão form-floating nativa e sem bugs) -->
          <div class="form-floating mb-4">
            <!-- No form-floating, o placeholder é obrigatório para a magia do CSS funcionar, 
                 mas ele fica escondido pela label! -->
            <input type="email" id="email" class="form-control" placeholder="Email address" />
            <label for="email">Email address</label>
          </div>

          <!-- Password input (Versão form-floating nativa e sem bugs) -->
          <div class="form-floating mb-3">
            <input type="password" id="senha" class="form-control" placeholder="Password" />
            <label for="senha">Password</label>
          </div>

            <div class="d-flex justify-content-between align-items-center">
              <!-- Checkbox -->
              <div class="form-check mb-0">
                <input class="form-check-input me-2" type="checkbox" value="" id="form2Example3" />
                <label class="form-check-label" for="form2Example3">
                  Remember me
                </label>
              </div>
              <a href="#!" class="text-body">Forgot password?</a>
            </div>

            <div class="text-center text-lg-start mt-4 pt-2">
              <button type="submit" id="btn-login" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg"
                style="padding-left: 2.5rem; padding-right: 2.5rem;" disabled>Login</button>
              <p class="small fw-bold mt-2 pt-1 mb-0">Don't have an account? <a href="#!"
                  class="link-danger">Register</a>
              </p>
            </div>

          </form>
        </div>
      </div>
      <div
        class="d-flex flex-column flex-md-row text-center text-md-start justify-content-between py-4 px-4 px-xl-5 bg-primary">
        <div class="text-white mb-3 mb-md-0">
          Copyright © 2020. All rights reserved.
        </div>
        <div>
          <a href="#!" class="text-white me-4"><i class="fab fa-facebook-f"></i></a>
          <a href="#!" class="text-white me-4"><i class="fab fa-twitter"></i></a>
          <a href="#!" class="text-white me-4"><i class="fab fa-google"></i></a>
          <a href="#!" class="text-white"><i class="fab fa-linkedin-in"></i></a>
        </div>
      </div>
  </section>

  <script type="module" src="./js/login.js"></script>
  
</body>

</html>
