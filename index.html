<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVP - Controle de Produtos</title>

    <!-- Bibliotecas e Frameworks permitidos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.1.0/mdb.min.css" rel="stylesheet" />

    <!-- NOSSO CSS PERSONALIZADO (Garante os pontos da Obs 2) -->
    <link rel="stylesheet" href="styles/global.css">
</head>

<body>
    <!-- ==========================================
    FORA DA TELA: TOAST DE NOTIFICAÇÃO
=========================================== -->
    <div id="toast-container" class="toast-container">
        <div id="toast-mensagem" class="toast-msg">Mensagem de erro aqui</div>
    </div>

    <!-- ================= 1. MENU LATERAL (OFFCANVAS) ================= -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu" style="width: 25%;">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold">Menu</h5>
            <button type="button" class="btn-close" data-mdb-dismiss="offcanvas" aria-label="Fechar"></button>
        </div>

        <div class="offcanvas-body d-flex flex-column justify-content-between py-4">
            <!-- Parte Superior: Temas -->
            <div class="d-flex flex-column gap-2">
                <button id="btn-tema-claro" class="btn btn-outline-secondary text-start w-100">
                    <i class="fas fa-sun me-2"></i> Claro
                </button>
                <button id="btn-tema-escuro" class="btn btn-outline-secondary text-start w-100">
                    <i class="fas fa-moon me-2"></i> Escuro
                </button>
                <button id="btn-tema-tech" class="btn btn-outline-secondary text-start w-100">
                    <i class="fas fa-microchip me-2"></i> Tech
                </button>
            </div>

            <!-- Parte Inferior: Gerenciamento de Conta -->
            <div class="d-flex flex-column gap-2 mt-auto">
                <button id="btn-encerrar-conta" class="btn btn-outline-danger text-start w-100">
                    <i class="fas fa-user-times me-2"></i> Encerrar Conta
                </button>
                <button id="btn-sair" class="btn btn-danger text-start w-100">
                    <i class="fas fa-sign-out-alt me-2"></i> Sair
                </button>
            </div>
        </div>
    </div>

    <!-- ==========================================
         TELA 1: LOGIN (Visível por padrão)
    =========================================== -->
    <section id="tela-login" class="vh-100 d-flex justify-content-center align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4 text-center">
                    <h2 class="mb-4 fw-bold text-primary">Acesso ao Sistema</h2>
                    <form id="form-login" class="card p-4 shadow-sm">

                        <div class="form-floating mb-3">
                            <input type="email" id="email" class="form-control" placeholder="Email" required />
                            <label for="email">E-mail</label>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="password" id="senha" class="form-control" placeholder="Senha" required />
                            <label for="senha">Senha</label>
                        </div>

                        <button type="submit" id="btn-login" class="btn btn-primary btn-lg w-100">Entrar</button>
                        <!-- Botão para alternar para a tela de cadastro -->
                        <button type="button" id="btn-ir-cadastro" class="btn btn-link btn-sm text-decoration-none">Não
                            tem uma conta? Cadastre-se</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- ==========================================
         TELA 2: PAINEL PRINCIPAL (Invisível por padrão)
    =========================================== -->

    <section id="tela-painel" style="display: none;">
        <div class="container py-4">
            <!-- ================= 2. BARRA SUPERIOR (PRIMEIRA LINHA) ================= -->
            <div class="container-fluid px-0 mb-4 mt-3">
                <div class="d-flex align-items-center gap-2 w-100">
                    <!-- Botão Abrir Menu Lateral -->
                    <!-- <button id="btn-menu" class="btn btn-secondary px-3 shadow-sm" type="button"
                        data-mdb-toggle="offcanvas" data-mdb-target="#sidebarMenu" aria-controls="sidebarMenu"
                        title="Menu">
                        <i class="fas fa-bars"></i>
                    </button> -->
                    <!-- Botão Abrir Menu Lateral (Sem atributos data-mdb) -->
                    <button id="btn-menu" class="btn btn-secondary px-3 shadow-sm" type="button" title="Menu">
                        <i class="fas fa-bars"></i>
                    </button>

                    <!-- Campo de Busca -->
                    <div class="form-outline flex-grow-1 mb-0" data-mdb-input-init>
                        <input type="text" id="input-busca" class="form-control" placeholder="Pesquisar produto..." />
                    </div>

                    <!-- Botão Vincular -->
                    <button id="btn-vincular" class="btn btn-warning text-white shadow-sm px-3 text-nowrap">
                        <i class="fas fa-link me-1"></i> Vincular
                    </button>

                    <!-- Ícone: Abrir Câmera -->
                    <button type="button" id="btn-abrir-camera" class="btn btn-primary px-3 shadow-sm"
                        title="Abrir Câmera">
                        <i class="fas fa-camera"></i>
                    </button>

                    <!-- Ícone: Anexar Arquivo -->
                    <label for="input-comprovante" id="btn-upload"
                        class="btn btn-outline-primary mb-0 px-3 shadow-sm d-flex align-items-center justify-content-center"
                        style="cursor: pointer; height: 38px;" title="Anexar Arquivo">
                        <i class="fas fa-upload"></i>
                    </label>
                    <input type="file" id="input-comprovante" class="d-none" accept="image/*" />
                </div>
            </div>

            <!-- ================= 3. MODAL DA CÂMERA (COM O RESULTADO DENTRO) ================= -->
            <div class="modal fade" id="modalCamera" tabindex="-1" aria-labelledby="modalCameraLabel"
                aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header border-0 pb-0">
                            <h5 class="modal-title fw-bold" id="modalCameraLabel">Escanear Produto</h5>
                            <button type="button" class="btn-close" data-mdb-dismiss="modal"
                                aria-label="Close"></button>
                        </div>
                        <div class="modal-body text-center p-3">
                            <video id="video-camera" autoplay playsinline class="w-100 rounded mb-2 shadow-sm"
                                style="max-height: 300px; object-fit: cover;"></video>
                            <canvas id="canvas-camera" class="d-none"></canvas>

                            <!-- O DIV DE RESULTADO AGORA FICA AQUI DENTRO -->
                            <div id="resultado" class="text-muted small mt-2 fw-semibold">
                                Pronto para escanear produto.
                            </div>
                        </div>
                        <div class="modal-footer border-0 d-flex justify-content-center gap-2 pt-0 pb-3">
                            <button type="button" id="btn-voltar-camera" class="btn btn-secondary px-4"
                                data-mdb-dismiss="modal">Voltar</button>
                            <button type="button" id="btn-capturar-foto" class="btn btn-success px-4">Capturar</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal de Confirmação para Encerrar Conta -->
            <div class="modal fade" id="modalEncerrarConta" tabindex="-1" aria-labelledby="modalEncerrarContaLabel"
                aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header border-0">
                            <h5 class="modal-title text-danger" id="modalEncerrarContaLabel">Encerrar Conta</h5>
                            <button type="button" class="btn-close" data-mdb-dismiss="modal"
                                aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <p class="text-muted">Tem certeza de que deseja encerrar sua conta? Esta ação é
                                irreversível e apagará todos os seus dados.</p>
                            <div class="form-outline mb-3">
                                <input type="password" id="senha-confirmacao" class="form-control" />
                                <label class="form-label" for="senha-confirmacao">Digite sua senha para
                                    confirmar</label>
                            </div>
                        </div>
                        <div class="modal-footer border-0">
                            <button type="button" class="btn btn-secondary" data-mdb-dismiss="modal">Não</button>
                            <button type="button" id="btn-confirmar-encerramento" class="btn btn-danger">Sim,
                                Encerrar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        </div>

        <hr class="my-4">

        <!-- Lista de Produtos -->
        <div class="mx-auto" style="max-width: 500px;">
            <h5 class="mb-3 text-center fw-bold">
                Produtos Capturados
                <span id="loading-produtos" style="display: none; margin-left: 10px; vertical-align: middle;">
                    <!-- Spinner nativo do Bootstrap -->
                    <span class="spinner-border spinner-border-sm text-primary" role="status" aria-hidden="true"></span>
                </span>
            </h5>

            <ul class="list-group list-group-flush" id="lista-produtos">
                <!-- Os itens virão do Javascript -->
            </ul>
            <!-- <div class="form-outline mb-3" data-mdb-input-init>
                    <input type="text" id="input-busca" class="form-control" placeholder="Pesquisar produto..." />
                </div>

                <ul class="list-group list-group-flush" id="lista-produtos">
                </ul> -->
        </div>
        </div>
    </section>

    <!-- MODAL DE HISTÓRICO DE PREÇOS -->
    <div class="modal fade" id="modalHistorico" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">

            <!-- ADICIONE ESTE ESTILO DIRETO NA DIV OU NO CSS -->
            <div class="modal-content shadow-lg"
                style="background-color: var(--bg-card) !important; color: var(--text-main) !important; opacity: 1 !important; border: 1px solid var(--border-color);">

                <!-- Cabeçalho -->
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title fw-bold" id="tituloModal">Histórico de Preços</h5>
                    <button type="button" class="btn-close" data-mdb-dismiss="modal" aria-label="Close"></button>
                </div>

                <!-- Corpo -->
                <div class="modal-body">
                    <h6 id="nomeProdutoModal" class="mb-4" style="color: var(--btn-primary);">Nome do Produto</h6>
                    <ul class="list-group list-group-flush" id="listaHistorico">
                        <!-- Dados inseridos via JS -->
                    </ul>
                </div>
                <!-- Gráfico-->>
                <div class="mt-4">
                    <canvas id="graficoHistorico"></canvas>
                </div>

                <!-- Rodapé -->
                <div class="modal-footer border-top-0">
                    <button type="button" class="btn btn-secondary" data-mdb-dismiss="modal">Fechar</button>
                </div>

            </div>
        </div>
    </div>

    <!-- ==========================================
    NOVO: TELA 3: CADASTRO DE USUÁRIO (Invisível por padrão)
=========================================== -->
    <section id="tela-cadastro" class="vh-100 d-flex justify-content-center align-items-center d-none">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card p-4 shadow-sm">
                        <h2 class="mb-4 fw-bold text-center text-primary">Criar Nova Conta</h2>

                        <form id="form-cadastro">
                            <div class="form-floating mb-3">
                                <input type="text" id="cad-nome" class="form-control" placeholder="Nome Completo"
                                    required />
                                <label for="cad-nome">Nome Completo</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" id="cad-cpf" class="form-control" placeholder="CPF" required />
                                <label for="cad-cpf">CPF (123.456.789-00)</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="email" id="cad-email" class="form-control" placeholder="E-mail" required />
                                <label for="cad-email">E-mail</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="date" id="cad-nascimento" class="form-control" placeholder="Nascimento" />
                                <label for="cad-nascimento">Data de Nascimento</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="tel" id="cad-telefone" class="form-control" placeholder="Telefone" />
                                <label for="cad-telefone">Telefone (Somente números)</label>
                            </div>

                            <div class="form-floating mb-4">
                                <input type="password" id="cad-senha" class="form-control" placeholder="Senha"
                                    required />
                                <label for="cad-senha">Senha</label>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="button" id="btn-voltar-login"
                                    class="btn btn-secondary w-50">Voltar</button>
                                <button type="submit" id="btn-cadastrar-acao"
                                    class="btn btn-success w-50">Cadastrar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 1º: MDBootstrap (Sempre primeiro, pois os seus scripts podem precisar dele) -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.1.0/mdb.umd.min.js"
        defer></script>


    <!-- 2º: As constantes carregam primeiro na memória -->
    <script src="js/elements.js" defer></script>
    <script src="js/constantes.js" defer></script>

    <!-- 3º: O arquivo principal que orquestra tudo -->
    <script src="js/app.js" defer></script>

    <!-- 4º: As lógicas específicas -->
    <script src="js/autenticacao.js" defer></script>
    <script src="js/camera.js" defer></script>
    <script src="js/upload.js" defer></script>
    <script src="js/produtos.js" defer></script>
    <script src="js/cadastro.js" defer></script>

    <!-- 5º: Outros scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" defer></script>
</body>

</html>
